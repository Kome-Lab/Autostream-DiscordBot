name: autostream-discord-bot CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: autostream-discord-bot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Resolve DAVE cache key
        id: dave-cache-key
        shell: bash
        run: |
          set -euo pipefail
          vcpkg_root="$PWD/third_party/discordgo/dave/libdave/cpp/vcpkg"
          echo "vcpkg_commit=$(git -C "$vcpkg_root" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache DAVE native build
        id: dave-cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            third_party/discordgo/dave/libdave/cpp/build
            third_party/discordgo/dave/libdave/cpp/vcpkg/vcpkg
            third_party/discordgo/dave/libdave/cpp/vcpkg/downloads
            third_party/discordgo/dave/libdave/cpp/vcpkg/packages
            third_party/discordgo/dave/libdave/cpp/vcpkg/installed
          key: ${{ runner.os }}-${{ runner.arch }}-dave-${{ steps.dave-cache-key.outputs.vcpkg_commit }}-${{ hashFiles('third_party/discordgo/dave/libdave/cpp/CMakeLists.txt', 'third_party/discordgo/dave/libdave/cpp/Makefile', 'third_party/discordgo/dave/libdave/cpp/src/**', 'third_party/discordgo/dave/libdave/cpp/includes/**', 'third_party/discordgo/dave/libdave/cpp/vcpkg-alts/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-dave-${{ steps.dave-cache-key.outputs.vcpkg_commit }}-
      - name: Validate installer syntax
        shell: bash
        run: bash -n release/install-autostream-discord-bot
      - name: Validate installer integration fixture syntax
        shell: bash
        run: bash -n release/test-install-autostream-discord-bot-integration.sh
      - name: Test installer integration scenarios
        shell: bash
        run: sudo bash release/test-install-autostream-discord-bot-integration.sh
      - name: Build pinned libdave for DAVE voice tests
        shell: bash
        run: |
          set -euo pipefail
          vcpkg_root="$PWD/third_party/discordgo/dave/libdave/cpp/vcpkg"
          cpp_root="$PWD/third_party/discordgo/dave/libdave/cpp"
          build_dir="$cpp_root/build"
          missing_tool=0
          for tool in cmake ninja g++ make pkg-config autoconf automake libtool zip unzip tar; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              missing_tool=1
            fi
          done
          if [ "$missing_tool" -eq 1 ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              cmake ninja-build g++ make pkg-config autoconf automake libtool \
              zip unzip tar
          fi
          if [ ! -x "$vcpkg_root/vcpkg" ]; then
            git -C "$vcpkg_root" fetch --unshallow || git -C "$vcpkg_root" fetch --all --tags
            for bootstrap_attempt in 1 2 3; do
              echo "Bootstrapping vcpkg (attempt ${bootstrap_attempt}/3)"
              if "$vcpkg_root/bootstrap-vcpkg.sh" -disableMetrics; then
                break
              fi
              if [ "$bootstrap_attempt" -eq 3 ]; then
                echo 'vcpkg bootstrap failed after 3 attempts' >&2
                exit 1
              fi
              sleep $((bootstrap_attempt * 15))
            done
          fi
          test -x "$vcpkg_root/vcpkg"
          export CC=gcc CXX=g++
          cache_hit="${{ steps.dave-cache.outputs.cache-hit }}"
          if [ "$cache_hit" = "true" ] && [ -f "$build_dir/libdave.a" ]; then
            echo 'Using exact cached libdave build.'
            exit 0
          fi
          # Hosted-runner GitHub archive downloads can reset transiently; retain
          # completed vcpkg packages and retry the configure/build as a unit.
          # This is the explicit-CMake equivalent of:
          # make -C third_party/discordgo/dave/libdave/cpp BUILD_TYPE=Release
          for attempt in 1 2 3; do
            echo "Building pinned libdave (attempt ${attempt}/3)"
            if cmake -S "$cpp_root" -B "$build_dir" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DVCPKG_MANIFEST_DIR="$cpp_root/vcpkg-alts/openssl_3" \
              -DCMAKE_TOOLCHAIN_FILE="$cpp_root/vcpkg/scripts/buildsystems/vcpkg.cmake" \
              -DBUILD_SHARED_LIBS=OFF \
              -DENABLE_SANITIZERS=OFF \
              -DPERSISTENT_KEYS=OFF \
              -DTESTING=OFF \
              -DCMAKE_INSTALL_PREFIX="$build_dir/install" \
              -DINSTALL_VCPKG_LICENSES=OFF \
              && cmake --build "$build_dir" --target libdave --config Release; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'libdave build failed after 3 attempts' >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done
      - name: Test Go packages with DAVE-linked DiscordGo
        shell: bash
        run: |
          set -euo pipefail
          libdave_build="$PWD/third_party/discordgo/dave/libdave/cpp/build"
          vcpkg_libdir="$(find "$libdave_build/vcpkg_installed" -maxdepth 2 -type d -name lib -print -quit)"
          test -n "$vcpkg_libdir"
          vcpkg_libs="$(find "$vcpkg_libdir" -maxdepth 1 -type f -name '*.a' -print | sort | tr '\n' ' ')"
          CGO_ENABLED=1 \
          CGO_CFLAGS="-I$PWD/third_party/discordgo/dave/libdave/cpp/includes" \
          CGO_LDFLAGS="-L$vcpkg_libdir $libdave_build/libdave.a -Wl,--start-group $vcpkg_libs -Wl,--end-group -lstdc++ -lm -ldl -lpthread" \
            go test -p 1 ./...
      - name: Build Go packages with DAVE-linked DiscordGo
        shell: bash
        run: |
          set -euo pipefail
          libdave_build="$PWD/third_party/discordgo/dave/libdave/cpp/build"
          vcpkg_libdir="$(find "$libdave_build/vcpkg_installed" -maxdepth 2 -type d -name lib -print -quit)"
          test -n "$vcpkg_libdir"
          vcpkg_libs="$(find "$vcpkg_libdir" -maxdepth 1 -type f -name '*.a' -print | sort | tr '\n' ' ')"
          CGO_ENABLED=1 \
          CGO_CFLAGS="-I$PWD/third_party/discordgo/dave/libdave/cpp/includes" \
          CGO_LDFLAGS="-L$vcpkg_libdir $libdave_build/libdave.a -Wl,--start-group $vcpkg_libs -Wl,--end-group -lstdc++ -lm -ldl -lpthread" \
            go build ./...
