name: autostream-discord-bot CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: autostream-discord-bot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Verify authored sources and raw distributions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/ci -p 'test_artifact_assembly.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_verify_source_integrity.py' -v
          python3 scripts/ci/verify_source_integrity.py \
            --repository Autostream-DiscordBot --tree "$(git rev-parse HEAD)"
          for script in release/installer-tests/*/*.sh; do bash -n "${script}"; done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Check shared Node implementation formatting
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only --diff-filter=ACMRT e1805ba5c16c9ed3b61ef83bf7864af6bdb045cd -- '*.go')
          if (( ${#files[@]} > 0 )); then
            fmt_status=0
            diff="$(gofmt -d "${files[@]}")" || fmt_status=$?
            printf '%s\n' "$diff"
            if [[ -n "$diff" || "$fmt_status" -ne 0 ]]; then
              exit 1
            fi
          fi
      - name: Resolve DAVE cache key
        id: dave-cache-key
        shell: bash
        run: |
          set -euo pipefail
          vcpkg_root="$PWD/third_party/discordgo/dave/libdave/cpp/vcpkg"
          echo "vcpkg_commit=$(git -C "$vcpkg_root" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache DAVE native build
        id: dave-cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            third_party/discordgo/dave/libdave/cpp/build
            third_party/discordgo/dave/libdave/cpp/vcpkg/vcpkg
            third_party/discordgo/dave/libdave/cpp/vcpkg/downloads
            third_party/discordgo/dave/libdave/cpp/vcpkg/packages
            third_party/discordgo/dave/libdave/cpp/vcpkg/installed
          key: ${{ runner.os }}-${{ runner.arch }}-dave-${{ steps.dave-cache-key.outputs.vcpkg_commit }}-${{ hashFiles('third_party/discordgo/dave/libdave/cpp/CMakeLists.txt', 'third_party/discordgo/dave/libdave/cpp/Makefile', 'third_party/discordgo/dave/libdave/cpp/src/**', 'third_party/discordgo/dave/libdave/cpp/includes/**', 'third_party/discordgo/dave/libdave/cpp/vcpkg-alts/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-dave-${{ steps.dave-cache-key.outputs.vcpkg_commit }}-
      - name: Validate installer syntax
        shell: bash
        run: bash -n release/install-autostream-discord-bot
      - name: Validate installer integration fixture syntax
        shell: bash
        run: bash -n release/test-install-autostream-discord-bot-integration.sh
      - name: Test installer integration scenarios
        shell: bash
        run: sudo bash release/test-install-autostream-discord-bot-integration.sh
      - name: Build pinned libdave for DAVE voice tests
        shell: bash
        run: |
          set -euo pipefail
          vcpkg_root="$PWD/third_party/discordgo/dave/libdave/cpp/vcpkg"
          cpp_root="$PWD/third_party/discordgo/dave/libdave/cpp"
          build_dir="$cpp_root/build"
          missing_tool=0
          for tool in cmake ninja g++ make pkg-config autoconf automake libtool zip unzip tar; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              missing_tool=1
            fi
          done
          if [ "$missing_tool" -eq 1 ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              cmake ninja-build g++ make pkg-config autoconf automake libtool \
              zip unzip tar
          fi
          if [ ! -x "$vcpkg_root/vcpkg" ]; then
            git -C "$vcpkg_root" fetch --unshallow || git -C "$vcpkg_root" fetch --all --tags
            for bootstrap_attempt in 1 2 3; do
              echo "Bootstrapping vcpkg (attempt ${bootstrap_attempt}/3)"
              if "$vcpkg_root/bootstrap-vcpkg.sh" -disableMetrics; then
                break
              fi
              if [ "$bootstrap_attempt" -eq 3 ]; then
                echo 'vcpkg bootstrap failed after 3 attempts' >&2
                exit 1
              fi
              sleep $((bootstrap_attempt * 15))
            done
          fi
          test -x "$vcpkg_root/vcpkg"
          export CC=gcc CXX=g++
          cache_hit="${{ steps.dave-cache.outputs.cache-hit }}"
          if [ "$cache_hit" = "true" ] && [ -f "$build_dir/libdave.a" ]; then
            echo 'Using exact cached libdave build.'
            exit 0
          fi
          # Hosted-runner GitHub archive downloads can reset transiently; retain
          # completed vcpkg packages and retry the configure/build as a unit.
          # This is the explicit-CMake equivalent of:
          # make -C third_party/discordgo/dave/libdave/cpp BUILD_TYPE=Release
          for attempt in 1 2 3; do
            echo "Building pinned libdave (attempt ${attempt}/3)"
            if cmake -S "$cpp_root" -B "$build_dir" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DVCPKG_MANIFEST_DIR="$cpp_root/vcpkg-alts/openssl_3" \
              -DCMAKE_TOOLCHAIN_FILE="$cpp_root/vcpkg/scripts/buildsystems/vcpkg.cmake" \
              -DBUILD_SHARED_LIBS=OFF \
              -DENABLE_SANITIZERS=OFF \
              -DPERSISTENT_KEYS=OFF \
              -DTESTING=OFF \
              -DCMAKE_INSTALL_PREFIX="$build_dir/install" \
              -DINSTALL_VCPKG_LICENSES=OFF \
              && cmake --build "$build_dir" --target libdave --config Release; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'libdave build failed after 3 attempts' >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done
      - name: Test Go packages with DAVE-linked DiscordGo
        shell: bash
        run: |
          set -euo pipefail
          libdave_build="$PWD/third_party/discordgo/dave/libdave/cpp/build"
          vcpkg_libdir="$(find "$libdave_build/vcpkg_installed" -maxdepth 2 -type d -name lib -print -quit)"
          test -n "$vcpkg_libdir"
          vcpkg_libs="$(find "$vcpkg_libdir" -maxdepth 1 -type f -name '*.a' -print | sort | tr '\n' ' ')"
          CGO_ENABLED=1 \
          CGO_CFLAGS="-I$PWD/third_party/discordgo/dave/libdave/cpp/includes" \
          CGO_LDFLAGS="-L$vcpkg_libdir $libdave_build/libdave.a -Wl,--start-group $vcpkg_libs -Wl,--end-group -lstdc++ -lm -ldl -lpthread" \
            go test -p 1 ./...
          CGO_ENABLED=1 \
          CGO_CFLAGS="-I$PWD/third_party/discordgo/dave/libdave/cpp/includes" \
          CGO_LDFLAGS="-L$vcpkg_libdir $libdave_build/libdave.a -Wl,--start-group $vcpkg_libs -Wl,--end-group -lstdc++ -lm -ldl -lpthread" \
            go test -mod=readonly -p 1 -tags ui188_chain -count=1 -timeout=60s ./cmd/discord-bot -run '^TestUI188R4External(OpusRejectsMalformed|GatewayHandshake)$'
          CGO_ENABLED=1 \
          CGO_CFLAGS="-I$PWD/third_party/discordgo/dave/libdave/cpp/includes" \
          CGO_LDFLAGS="-L$vcpkg_libdir $libdave_build/libdave.a -Wl,--start-group $vcpkg_libs -Wl,--end-group -lstdc++ -lm -ldl -lpthread" \
            go test -mod=readonly -p 1 -tags ui188_chain -count=1 -timeout=60s ./cmd/discord-bot -run '^Test(UI188R9StaleAuthoritySeam|VCStartGatewayPresenceThroughJobHandler)$' -json | tee "$RUNNER_TEMP/ui188-gateway-start-regressions.json"
          jq -s -e '([.[]|select(.Action=="skip" or .Action=="fail")]|length)==0 and ([.[]|select(.Action=="pass" and (.Test=="TestUI188R9StaleAuthoritySeam" or .Test=="TestVCStartGatewayPresenceThroughJobHandler"))]|length)==2' "$RUNNER_TEMP/ui188-gateway-start-regressions.json"
          go list -json ./internal/discord > "$RUNNER_TEMP/ui188-r9-production-files.json"
          jq -e '(.GoFiles|index("ui188_chain_voice_linux.go"))==null and (.IgnoredGoFiles|index("ui188_chain_voice_linux.go"))!=null' "$RUNNER_TEMP/ui188-r9-production-files.json"
          go list -json ./internal/jobs > "$RUNNER_TEMP/ui188-start-production-files.json"
          jq -e '(.GoFiles|index("ui188_start_presence_diag_linux.go"))==null and (.IgnoredGoFiles|index("ui188_start_presence_diag_linux.go"))!=null' "$RUNNER_TEMP/ui188-start-production-files.json"
      - name: Race-test decomposed Discord packages with DAVE-linked DiscordGo
        timeout-minutes: 15
        env:
          GOMAXPROCS: '2'
        shell: bash
        run: |
          set -euo pipefail
          libdave_build="$PWD/third_party/discordgo/dave/libdave/cpp/build"
          vcpkg_libdir="$(find "$libdave_build/vcpkg_installed" -maxdepth 2 -type d -name lib -print -quit)"
          test -n "$vcpkg_libdir"
          vcpkg_libs="$(find "$vcpkg_libdir" -maxdepth 1 -type f -name '*.a' -print | sort | tr '\n' ' ')"
          CGO_ENABLED=1 \
          CGO_CFLAGS="-I$PWD/third_party/discordgo/dave/libdave/cpp/includes" \
          CGO_LDFLAGS="-L$vcpkg_libdir $libdave_build/libdave.a -Wl,--start-group $vcpkg_libs -Wl,--end-group -lstdc++ -lm -ldl -lpthread" \
            go test -mod=readonly -p 1 -race -count=1 ./internal/discord ./internal/jobs ./cmd/discord-bot ./internal/httpapi
      - name: Build Go packages with DAVE-linked DiscordGo
        shell: bash
        run: |
          set -euo pipefail
          libdave_build="$PWD/third_party/discordgo/dave/libdave/cpp/build"
          vcpkg_libdir="$(find "$libdave_build/vcpkg_installed" -maxdepth 2 -type d -name lib -print -quit)"
          test -n "$vcpkg_libdir"
          vcpkg_libs="$(find "$vcpkg_libdir" -maxdepth 1 -type f -name '*.a' -print | sort | tr '\n' ' ')"
          CGO_ENABLED=1 \
          CGO_CFLAGS="-I$PWD/third_party/discordgo/dave/libdave/cpp/includes" \
          CGO_LDFLAGS="-L$vcpkg_libdir $libdave_build/libdave.a -Wl,--start-group $vcpkg_libs -Wl,--end-group -lstdc++ -lm -ldl -lpthread" \
            go build ./...
      - name: Vet all native Go packages with the pinned DAVE build
        env:
          GOTOOLCHAIN: local
          GOWORK: 'off'
          GOFLAGS: '-mod=readonly'
          GOTELEMETRY: 'off'
        shell: bash
        run: |
          set -euo pipefail
          libdave_build="$PWD/third_party/discordgo/dave/libdave/cpp/build"
          vcpkg_libdir="$(find "$libdave_build/vcpkg_installed" -maxdepth 2 -type d -name lib -print -quit)"
          test -n "$vcpkg_libdir"
          vcpkg_libs="$(find "$vcpkg_libdir" -maxdepth 1 -type f -name '*.a' -print | sort | tr '\n' ' ')"
          CGO_ENABLED=1 \
          CGO_CFLAGS="-I$PWD/third_party/discordgo/dave/libdave/cpp/includes" \
          CGO_LDFLAGS="-L$vcpkg_libdir $libdave_build/libdave.a -Wl,--start-group $vcpkg_libs -Wl,--end-group -lstdc++ -lm -ldl -lpthread" \
            go vet -p 1 ./...

  v3-product-integration-checks:
    name: v3-product-integration-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOFLAGS: '-mod=readonly'
      GOTELEMETRY: 'off'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Required typed audioforward and original-Attempt UNKNOWN inventory
        run: bash scripts/ci/iu-checks.sh
      - name: Preserve exact root execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iu-bot-root-events-${{ github.sha }}
          path: ${{ runner.temp }}/iu-*.json
          if-no-files-found: error
          retention-days: 14

  v3-product-cross-repository-checks:
    name: v3-product-cross-repository-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOFLAGS: '-mod=readonly'
      GOTELEMETRY: 'off'
      GOMAXPROCS: '2'
      IU_BOT_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Publication is blocked until this is replaced by the reviewed Encoder
      # candidate containing its actual HTTP process helper and frozen manifest.
      IU_ER_CANDIDATE_SHA: '06075915574acb85b5756d7dbcec0decc7ad0767'
    defaults:
      run:
        working-directory: bot
        shell: bash
    steps:
      - name: Checkout exact Bot candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.IU_BOT_CANDIDATE_SHA }}
          path: bot
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Require a frozen Encoder candidate
        run: |
          set -euo pipefail
          test "$IU_ER_CANDIDATE_SHA" != 0000000000000000000000000000000000000000
          test "${#IU_ER_CANDIDATE_SHA}" = 40
      - name: Checkout exact Encoder candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Kome-Lab/Autostream-Encoder-Recorder
          ref: ${{ env.IU_ER_CANDIDATE_SHA }}
          path: encoder
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Verify both tested source trees and the same immutable shared pin
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$IU_BOT_CANDIDATE_SHA"
          test "$(git -C ../encoder rev-parse HEAD)" = "$IU_ER_CANDIDATE_SHA"
          test "$(go env GOVERSION)" = go1.26.5
          git log -1 --format='Bot tested commit: %H%nBot tested tree: %T'
          git -C ../encoder log -1 --format='Encoder tested commit: %H%nEncoder tested tree: %T'
          python3 scripts/ci/iu-source-boundary.py
          python3 scripts/ci/iu-module-pin.py a05e4d24bc9ffef54244dc5424b32d090f87e849 --download
          (cd ../encoder && python3 scripts/ci/iu-source-boundary.py)
          (cd ../encoder && python3 scripts/ci/iu-module-pin.py 8c17e7389ccdb3429f1e59a1a6147b27fe3c3793 --download)
      - name: Actual Bot HTTP client to independent Encoder process, Native and Race
        run: |
          set -euo pipefail
          export IU_WS3_ER_SOURCE="$GITHUB_WORKSPACE/encoder"
          for mode in native race; do
            flags=()
            if test "$mode" = race; then
              flags=(-race)
              export CGO_ENABLED=1
            else
              export CGO_ENABLED=0
            fi
            export IU_WS3_ER_BINARY="$RUNNER_TEMP/iu-encoder-http-$mode.test"
            (cd ../encoder && go test -p 1 "${flags[@]}" -tags=iu_crossrepo -c ./internal/httpapi -o "$IU_WS3_ER_BINARY")
            go test -p 1 "${flags[@]}" -tags=iu_crossrepo -count=1 -timeout=5m -json ./internal/audioforward -run '^TestIUWS3CrossRepositoryBotEncoder$' | tee "$RUNNER_TEMP/iu-cross-repository-$mode.json"
            python3 scripts/ci/iu-json-events.py scripts/ci/ws3-crossrepo-required-tests.txt "$RUNNER_TEMP/iu-cross-repository-$mode.json"
            for name in actual_raw_and_queue stale_vector_has_no_product_effect ack_loss_inspects_same_attempt_without_resend http_2xx_without_typed_body_is_unknown; do
              for action in run pass; do
                test "$(jq -sr --arg name "TestIUWS3CrossRepositoryBotEncoder/$name" --arg action "$action" '[.[] | select(.Package=="github.com/example/autostream-discord-bot/internal/audioforward" and .Test==$name and .Action==$action)] | length' "$RUNNER_TEMP/iu-cross-repository-$mode.json")" = 1
              done
            done
          done
          git diff --exit-code -- go.mod go.sum
          git -C ../encoder diff --exit-code -- go.mod go.sum
      - name: Preserve cross-repository execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iu-bot-encoder-root-events-${{ github.sha }}
          path: ${{ runner.temp }}/iu-cross-repository-*.json
          if-no-files-found: error
          retention-days: 14
